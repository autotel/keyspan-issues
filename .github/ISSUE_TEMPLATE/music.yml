name: The music doesn't make sense
description: A melody that sounds wrong or aimless, odd harmony, a bad ending.
title: "[Music] "
labels: [music]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What sounds wrong, and where?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Filled in by Keyspan when you report from the app (level, exercise number, keyboard, settings, browser, and a link that reopens the same exercise). Leave as is.
      render: text
  - type: textarea
    id: abc
    attributes:
      label: Score (ABC notation)
      description: Filled in by Keyspan. The exercise as ABC notation.
      render: text
