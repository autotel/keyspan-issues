name: Technical problem
description: Playback, display, page turning, MIDI, PDF export, settings.
title: "[Technical] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect? Steps to reproduce help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Filled in by Keyspan when you report from the app (level, exercise number, keyboard, settings, browser, and a link that reopens the same exercise). Leave as is.
      render: text
