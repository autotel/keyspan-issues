name: Something is wrong in the score
description: A wrong or unplayable note, a rhythm that does not add up, notation that is hard to read.
title: "[Score] "
labels: [bug, score]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, and where? (bar number, hand, note)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Filled in by Keyspan when you report from the app (level, exercise number, keyboard, settings, browser, and a link that reopens the same exercise). Leave as is.
      render: text
  - type: textarea
    id: abc
    attributes:
      label: Score (ABC notation)
      description: Filled in by Keyspan. The exercise as ABC notation.
      render: text
